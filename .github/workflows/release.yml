# Reclaim — збирання інсталятора на GitHub.
# Вкладка Actions → «Збирання» → «Run workflow»:
# • поле «Версія» порожнє — пробне збирання, файл з'явиться внизу сторінки запуску в «Artifacts»;
# • у полі «Версія» число (наприклад 0.3.0) — GitHub збере Reclaim-setup.exe і створить ЧЕРНЕТКУ релізу v0.3.0
#   з описом із CHANGES.md (розділ «## 0.3.0»). Перевір файл і натисни «Publish release».
name: Збирання

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія для релізу (наприклад 0.3.0). Порожньо — лише пробне збирання.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Перевірити версію
        if: inputs.version != ''
        shell: bash
        env:
          VER: ${{ inputs.version }}
        run: |
          VER="${VER#v}"
          # Номер у package.json має збігатися з номером релізу, інакше застосунок покаже не ту версію.
          grep -q "\"version\": \"$VER\"" package.json || { echo "::error::У package.json інша версія: зміни \"version\" на \"$VER\"."; exit 1; }

      - run: npm ci
      - run: npm run dist

      - name: Зберегти файл
        uses: actions/upload-artifact@v4
        with:
          name: Reclaim-setup
          path: dist/Reclaim-setup.exe

      - name: Створити чернетку релізу
        if: inputs.version != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ inputs.version }}
        run: |
          VER="${VER#v}"
          TAG="v$VER"
          # Опис релізу — розділ «## $VER» з CHANGES.md.
          NOTES=$(awk -v v="## $VER" '{sub(/\r$/,"")} $0==v{f=1;next} /^## /{if(f)exit} f' CHANGES.md | sed '/./,$!d')
          [ -z "$NOTES" ] && NOTES="Reclaim $VER для Windows."
          printf '%s\n\nЗавантаж Reclaim-setup.exe нижче й запусти його. Windows SmartScreen може попередити, бо інсталятор ще не підписаний. Ліцензії вбудованих утиліт: bin/NOTICE.txt.\n' "$NOTES" > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Чернетку (ще не опубліковану) переносимо на свіжий код і оновлюємо опис; опублікований реліз не чіпаємо.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file notes.md
              gh release upload "$TAG" dist/Reclaim-setup.exe --clobber
            else
              echo "::error::Реліз $TAG уже опубліковано. Збільш номер версії."; exit 1
            fi
          else
            gh release create "$TAG" dist/Reclaim-setup.exe --draft --target "$GITHUB_SHA" --title "Reclaim $VER" --notes-file notes.md
          fi
